plugins:
  - rubocop-airbnb
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - 'tmp/**/*'

Style/Documentation:
  Enabled: false
Style/RedundantSelf:
  Enabled: false
Style/GuardClause:
  Enabled: false
Style/WordArray:
  Enabled: true
  EnforcedStyle: brackets
Style/SymbolArray:
  Enabled: true
  EnforcedStyle: brackets
Style/HashSyntax:
  Enabled: true
  EnforcedShorthandSyntax: never
Style/CollectionMethods:
  Enabled: true
  PreferredMethods:
    map: collect
    collect: collect
    find: find
    detect: find
Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
Layout/LineLength:
  Max: 150
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Layout/DotPosition:
  Enabled: true
  EnforcedStyle: leading
Layout/EmptyLinesAroundBlockBody:
  Enabled: true
Style/FrozenStringLiteralComment:
  Enabled: false
